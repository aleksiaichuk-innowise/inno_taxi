syntax = "proto3";

package user.kafka.v1;

option go_package = "github.com/aleksiaichuk-innowise/inno_taxi/shared/proto/user_service;user_service";

message UserRegisteredEvent {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
  string created_at = 6;
}
