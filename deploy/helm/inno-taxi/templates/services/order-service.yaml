apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    {{ include "inno-taxi.labels" . | nindent 4}}
    app.kubernetes.io/component: order-service
spec:
  selector:
    matchLabels:
      {{ include "inno-taxi.selectorLabels" . | nindent 6}}
      app.kubernetes.io/component: order-service
  template:
    metadata:
      labels:
        {{ include "inno-taxi.selectorLabels" . | nindent 8}}
        app.kubernetes.io/component: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.image.registry}}/order-service:{{ .Values.image.tag}}"
          ports:
            - containerPort: 8080
            - containerPort: 9082
          env:
            - name: HTTP_ORDER_HOST
              value: "0.0.0.0"
            - name: HTTP_ORDER_PORT
              value: "8080"
            - name: GRPC_ORDER_HOST
              value: "0.0.0.0"
            - name: GRPC_ORDER_PORT
              value: "9082"
            - name: PG_ORDER_HOST
              value: postgres-order
            - name: PG_ORDER_PORT
              value: "5432"
            - name: PG_ORDER_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: pgOrderUser
            - name: PG_ORDER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: pgOrderPass
            - name: PG_ORDER_DATABASE
              value: order
            - name: ES_ORDER_HOST
              value: "http://elasticsearch:9200"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: jwtSecret
            - name: WALLET_SERVICE_BASE_URL
              value: "http://wallet-service:8084"
            - name: DRIVER_SERVICE_BASE_URL
              value: "http://driver-service:8081"


---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    {{ include "inno-taxi.labels" . | nindent 4}}
    app.kubernetes.io/component: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9082
      targetPort: 9082
      protocol: TCP
      name: grpc
  selector:
    {{- include "inno-taxi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: order-service






