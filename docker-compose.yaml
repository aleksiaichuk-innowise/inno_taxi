services:
  mongo:
    image: mongo:7
    container_name: taxi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-taxi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-taxi}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-ui:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-taxi}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-taxi}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USER:-taxi}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD:-taxi}
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
  postgres:
    image: postgres:18
    container_name: taxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ORDER_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_ORDER_PASS:-postgres}
      POSTGRES_DB: ${PG_ORDER_DATABASE:-order}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ORDER_USER:-postgres} -d ${PG_ORDER_DATABASE:-order}"]
      interval: 5s
      timeout: 5s
      retries: 10
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: taxi-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  user_service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: taxi-user-service
    restart: unless-stopped
    environment:
      HTTP_US_HOST: 0.0.0.0
      HTTP_US_PORT: 8080
      MONGO_US_HOST: mongo
      MONGO_US_PORT: 27017
      MONGO_US_DB: ${MONGO_DB:-taxi}
      MONGO_US_USERNAME: ${MONGO_ROOT_USER:-taxi}
      MONGO_US_PASSWORD: ${MONGO_ROOT_PASSWORD:-taxi}
      JWT_SECRET: ${JWT_SECRET:-taxi}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: taxi-auth-service
    restart: unless-stopped
    environment:
      HTTP_AUTH_HOST: 0.0.0.0
      HTTP_AUTH_PORT: 8082
      REDIS_ADDR: redis:6379
      USER_SERVICE_BASE_URL: http://user_service:8080
      JWT_SECRET: ${JWT_SECRET:-taxi}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      user_service:
        condition: service_started
  driver_service:
    build:
      context: .
      dockerfile: services/driver_service/Dockerfile
    container_name: taxi-driver-service
    restart: unless-stopped
    environment:
      HTTP_DS_HOST: 0.0.0.0
      HTTP_DS_PORT: 8081
      MONGO_DS_HOST: mongo
      MONGO_DS_PORT: 27017
      MONGO_DS_DB: ${MONGO_DRIVER_DB:-driver_taxi}
      MONGO_DS_USERNAME: ${MONGO_ROOT_USER:-taxi}
      MONGO_DS_PASSWORD: ${MONGO_ROOT_PASSWORD:-taxi}
      JWT_SECRET: ${JWT_SECRET:-taxi}
      KAFKA_BROKERS: kafka:9092
      ANALYTIC_SERVICE_BASE_URL: http://analytic_service:8085
    ports:
      # Host 8083, not 8081: mongo-ui already owns 8081 on the host (the
      # container itself still listens on 8081 - only the host-side
      # mapping needs to differ).
      - "8083:8081"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      analytic_service:
        condition: service_started
  gateway_service:
    build:
      context: services/gateway_service
      dockerfile: Dockerfile
    container_name: taxi-gateway-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      auth_service:
        condition: service_started
      user_service:
        condition: service_started
      driver_service:
        condition: service_started
      analytic_service:
        condition: service_started
      order_service:
        condition: service_started
  wallet_postgres:
    image: postgres:18
    container_name: taxi-wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_WALLET_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_WALLET_PASS:-postgres}
      POSTGRES_DB: ${PG_WALLET_DATABASE:-wallet}
    ports:
      - "5434:5432"
    volumes:
      - wallet-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_WALLET_USER:-postgres} -d ${PG_WALLET_DATABASE:-wallet}"]
      interval: 5s
      timeout: 5s
      retries: 10
  wallet_service:
    build:
      context: .
      dockerfile: services/wallet_service/Dockerfile
    container_name: taxi-wallet-service
    restart: unless-stopped
    environment:
      HTTP_WALLET_HOST: 0.0.0.0
      HTTP_WALLET_PORT: 8084
      PG_WALLET_HOST: wallet_postgres
      PG_WALLET_PORT: 5432
      PG_WALLET_USER: ${PG_WALLET_USER:-postgres}
      PG_WALLET_PASS: ${PG_WALLET_PASS:-postgres}
      PG_WALLET_DATABASE: ${PG_WALLET_DATABASE:-wallet}
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      wallet_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  order_service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: taxi-order-service
    restart: unless-stopped
    environment:
      HTTP_ORDER_HOST: 0.0.0.0
      HTTP_ORDER_PORT: 8080
      GRPC_ORDER_HOST: 0.0.0.0
      GRPC_ORDER_PORT: 9082
      PG_ORDER_HOST: postgres
      PG_ORDER_PORT: 5432
      PG_ORDER_USER: ${PG_ORDER_USER:-postgres}
      PG_ORDER_PASS: ${PG_ORDER_PASS:-postgres}
      PG_ORDER_DATABASE: ${PG_ORDER_DATABASE:-order}
      ES_ORDER_HOST: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-taxi}
      WALLET_SERVICE_BASE_URL: http://wallet_service:8084
      DRIVER_SERVICE_BASE_URL: http://driver_service:8081
    ports:
      # Host 8086, not 8080: user_service already owns 8080 on the host
      # (container itself still listens on 8080 - gateway_service's
      # nginx.conf hardcodes "order_service:8080" for in-network calls, so
      # only the host-side mapping needs to differ).
      - "8086:8080"
      - "9082:9082"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wallet_service:
        condition: service_started
      driver_service:
        condition: service_started
  kafka:
    image: apache/kafka:3.9.0
    container_name: taxi-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: taxi-clickhouse
    restart: unless-stopped
    # IPv6 isn't available in every docker network this stack runs in;
    # ClickHouse's default config listens on both stacks and refuses to
    # start any listener at all if the IPv6 bind fails outright, even
    # though the IPv4 one would have worked - force IPv4-only via a
    # config.d override (the documented way; CLI --listen_host isn't
    # accepted by this image's entrypoint wrapper).
    volumes:
      - ./services/analytic_service/clickhouse-listen-ipv4.xml:/etc/clickhouse-server/config.d/listen-ipv4.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
    ports:
      - "8123:8123"
      - "9002:9000"
    healthcheck:
      # 127.0.0.1, not localhost: this environment has no working IPv6, and
      # "localhost" resolves to ::1 first - the same class of bug the
      # listen_host override above works around, just on the client side.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
  analytic_service:
    build:
      context: .
      dockerfile: services/analytic_service/Dockerfile
    container_name: taxi-analytic-service
    restart: unless-stopped
    environment:
      HTTP_ANALYTIC_HOST: 0.0.0.0
      HTTP_ANALYTIC_PORT: 8085
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
volumes:
  mongo-data:
  postgres-data:
  redis-data:
  wallet-postgres-data:
  clickhouse-data:
  elasticsearch-data:
