apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  labels:
    {{ include "inno-taxi.labels" . | nindent 4}}
    app.kubernetes.io/component: driver-service
spec:
  selector:
    matchLabels:
      {{ include "inno-taxi.selectorLabels" . | nindent 6}}
      app.kubernetes.io/component: driver-service
  template:
    metadata:
      labels:
        {{ include "inno-taxi.selectorLabels" . | nindent 8}}
        app.kubernetes.io/component: driver-service
    spec:
      containers:
        - name: driver-service
          image: "{{ .Values.image.registry}}/driver-service:{{ .Values.image.tag}}"
          ports:
            - containerPort: 8081
          env:
            - name: HTTP_DS_HOST
              value: "0.0.0.0"
            - name: HTTP_DS_PORT
              value: "8081"
            - name: MONGO_DS_HOST
              value: mongo
            - name: MONGO_DS_PORT
              value: "27017"
            - name: MONGO_DS_DB
              value: driver_taxi
            - name: MONGO_DS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: mongoRootUser
            - name: MONGO_DS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: mongoRootPassword
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "inno-taxi.fullname" . }}-secrets
                  key: jwtSecret
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: ANALYTIC_SERVICE_BASE_URL
              value: http://analytic-service:8085

---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  labels:
    {{ include "inno-taxi.labels" . | nindent 4}}
    app.kubernetes.io/component: driver-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    {{- include "inno-taxi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: driver-service






