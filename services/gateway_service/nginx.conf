worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Every backend hostname below is resolved per-request through
    # Docker's embedded DNS (127.0.0.11), not once at nginx startup. A
    # static `upstream {}` block resolves its host once at boot and
    # caches the IP until the next reload - so it fails to start at all if
    # a dependency isn't resolvable yet (order_service, which isn't in
    # docker-compose.yaml today), and keeps proxying to a stale, dead IP
    # after any other backend container gets recreated. Using a variable
    # in proxy_pass forces per-request resolution instead, so gateway_service
    # starts cleanly regardless of dependency ordering and keeps working
    # across a backend's restart.
    resolver 127.0.0.11 valid=10s;

    # README assigns login rate limiting to Gateway Service; auth_service's
    # own spec explicitly deferred it here.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;

    log_format gateway '$remote_addr - $request_time - "$request" $status';
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    default_type application/json;

    server {
        listen 8000;

        # -- health -------------------------------------------------------
        location = /healthz {
            return 200 '{"status":"ok"}';
        }

        # -- internal auth_request targets ---------------------------------
        # Each of these proxies to auth_service's /validate carrying the
        # client's Authorization header, and (for the role-gated one) an
        # X-Required-Role hint that auth_service checks the token's claims
        # against. A non-2xx response here becomes the response to the
        # original request automatically - that's the whole point of
        # auth_request.
        location = /_gateway/validate {
            internal;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /_gateway/validate/admin {
            internal;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Required-Role "admin";
        }

        location = /_gateway/validate/analyst {
            internal;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Required-Role "analyst";
        }

        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type application/json;
            return 401 '{"message":"unauthorized"}';
        }

        error_page 403 = @forbidden;
        location @forbidden {
            default_type application/json;
            return 403 '{"message":"forbidden"}';
        }

        # -- auth_service: /auth/* -----------------------------------------
        location = /auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/login;
        }

        location = /auth/refresh {
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/refresh;
        }

        location = /auth/logout {
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/logout;
        }

        # -- user_service: /users/* -----------------------------------------
        location = /users/register {
            set $user_service "user_service:8080";
            proxy_pass http://$user_service/register;
        }

        location /users/profile {
            # `set` must come before `rewrite ... break;` - break stops
            # ngx_http_rewrite_module directive processing for the rest of
            # this location, so a `set` written after it would never run,
            # leaving $user_service empty at proxy_pass time.
            set $user_service "user_service:8080";
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/users(/.*)$ $1 break;
            proxy_pass http://$user_service;
        }

        location ~ ^/users/admin/ {
            set $user_service "user_service:8080";
            auth_request /_gateway/validate/admin;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/users(/.*)$ $1 break;
            proxy_pass http://$user_service;
        }

        # -- driver_service: /drivers/* -------------------------------------
        location /drivers/profile {
            set $driver_service "driver_service:8081";
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/drivers(/.*)$ $1 break;
            proxy_pass http://$driver_service;
        }

        # -- order_service: /orders ------------------------------------------
        # $is_args$args must be appended explicitly: proxy_pass with a
        # literal replacement URI (needed here to map /orders -> /v1/orders)
        # does not forward the original query string on its own - without
        # it, ListOrders' ?limit=&offset= (GET /orders) silently vanished
        # while CreateOrder's POST /orders (no query params) looked fine.
        location = /orders {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            proxy_pass http://$order_service/v1/orders$is_args$args;
        }

        location ~ ^/orders/(?<order_id>[^/]+)/cancel$ {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            rewrite ^/orders/([^/]+)/cancel$ /v1/orders/$1/cancel break;
            proxy_pass http://$order_service;
        }

        # start/complete are driver-only in practice (order_service checks
        # the caller is the order's assigned driver), but that's enforced
        # service-side, same as /orders itself isn't role-gated here either -
        # see the trip-lifecycle design doc.
        location ~ ^/orders/(?<order_id>[^/]+)/start$ {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            rewrite ^/orders/([^/]+)/start$ /v1/orders/$1/start break;
            proxy_pass http://$order_service;
        }

        location ~ ^/orders/(?<order_id>[^/]+)/complete$ {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            rewrite ^/orders/([^/]+)/complete$ /v1/orders/$1/complete break;
            proxy_pass http://$order_service;
        }

        location ~ ^/orders/(?<order_id>[^/]+)/rate$ {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            rewrite ^/orders/([^/]+)/rate$ /v1/orders/$1/rate break;
            proxy_pass http://$order_service;
        }

        # Analyst-only search across all orders - an exact-match location,
        # so nginx selects it over the ^/orders/(?<order_id>[^/]+)$ regex
        # below regardless of file order (exact matches are always checked
        # first). $is_args$args is required for the same reason it was
        # added to /orders - a literal proxy_pass rewrite URI doesn't
        # forward the query string on its own, and every filter here rides
        # in the query string.
        location = /orders/search {
            set $order_service "order_service:8080";
            auth_request /_gateway/validate/analyst;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            proxy_pass http://$order_service/v1/orders/search$is_args$args;
        }

        # Single-order view (GET /orders/{id}) - viewable by either the
        # rider or the assigned driver, enforced service-side. No trailing
        # action segment, so it can't collide with the /cancel, /start,
        # /complete, /rate locations above (their patterns all require one).
        location ~ ^/orders/(?<order_id>[^/]+)$ {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            rewrite ^/orders/([^/]+)$ /v1/orders/$1 break;
            proxy_pass http://$order_service;
        }

        # -- analytic_service: /analytics/* -----------------------------------
        location /analytics/ {
            set $analytic_service "analytic_service:8085";
            auth_request /_gateway/validate/analyst;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/analytics(/.*)$ $1 break;
            proxy_pass http://$analytic_service;
        }
    }
}
