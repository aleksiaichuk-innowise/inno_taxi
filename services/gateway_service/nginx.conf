worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Every backend hostname below is resolved per-request through
    # Docker's embedded DNS (127.0.0.11), not once at nginx startup. A
    # static `upstream {}` block resolves its host once at boot and
    # caches the IP until the next reload - so it fails to start at all if
    # a dependency isn't resolvable yet (order_service, which isn't in
    # docker-compose.yaml today), and keeps proxying to a stale, dead IP
    # after any other backend container gets recreated. Using a variable
    # in proxy_pass forces per-request resolution instead, so gateway_service
    # starts cleanly regardless of dependency ordering and keeps working
    # across a backend's restart.
    resolver 127.0.0.11 valid=10s;

    # README assigns login rate limiting to Gateway Service; auth_service's
    # own spec explicitly deferred it here.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;

    log_format gateway '$remote_addr - $request_time - "$request" $status';
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    default_type application/json;

    server {
        listen 8000;

        # -- health -------------------------------------------------------
        location = /healthz {
            return 200 '{"status":"ok"}';
        }

        # -- internal auth_request targets ---------------------------------
        # Each of these proxies to auth_service's /validate carrying the
        # client's Authorization header, and (for the role-gated one) an
        # X-Required-Role hint that auth_service checks the token's claims
        # against. A non-2xx response here becomes the response to the
        # original request automatically - that's the whole point of
        # auth_request.
        location = /_gateway/validate {
            internal;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /_gateway/validate/admin {
            internal;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Required-Role "admin";
        }

        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type application/json;
            return 401 '{"message":"unauthorized"}';
        }

        error_page 403 = @forbidden;
        location @forbidden {
            default_type application/json;
            return 403 '{"message":"forbidden"}';
        }

        # -- auth_service: /auth/* -----------------------------------------
        location = /auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/login;
        }

        location = /auth/refresh {
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/refresh;
        }

        location = /auth/logout {
            set $auth_service "auth_service:8082";
            proxy_pass http://$auth_service/logout;
        }

        # -- user_service: /users/* -----------------------------------------
        location = /users/register {
            set $user_service "user_service:8080";
            proxy_pass http://$user_service/register;
        }

        location /users/profile {
            # `set` must come before `rewrite ... break;` - break stops
            # ngx_http_rewrite_module directive processing for the rest of
            # this location, so a `set` written after it would never run,
            # leaving $user_service empty at proxy_pass time.
            set $user_service "user_service:8080";
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/users(/.*)$ $1 break;
            proxy_pass http://$user_service;
        }

        location ~ ^/users/admin/ {
            set $user_service "user_service:8080";
            auth_request /_gateway/validate/admin;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/users(/.*)$ $1 break;
            proxy_pass http://$user_service;
        }

        # -- driver_service: /drivers/* -------------------------------------
        location /drivers/profile {
            set $driver_service "driver_service:8081";
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            rewrite ^/drivers(/.*)$ $1 break;
            proxy_pass http://$driver_service;
        }

        # -- order_service: /orders ------------------------------------------
        # Config present for when order_service joins docker-compose (see
        # the gateway-service design doc) - not exercised by smoketest.sh
        # today since there's no order_service container to hit.
        location = /orders {
            auth_request /_gateway/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            set $order_service "order_service:8080";
            proxy_pass http://$order_service/v1/orders;
        }
    }
}
