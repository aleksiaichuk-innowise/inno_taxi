name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user_service, driver_service, auth_service, wallet_service, order_service, analytic_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - name: gofmt
        working-directory: services/${{ matrix.service }}
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: go build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: go test
        working-directory: services/${{ matrix.service }}
        run: go test ./...
      - name: go test integration
        working-directory: services/${{ matrix.service }}
        run: go test -tags=integration ./...

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user_service, driver_service, auth_service, wallet_service, order_service, analytic_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: services/${{ matrix.service }}
        run: govulncheck ./...

  build-and-push:
    needs: [test, vulncheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user_service
            image: user-service
            dockerfile: services/user_service/Dockerfile
            context: .
          - service: driver_service
            image: driver-service
            dockerfile: services/driver_service/Dockerfile
            context: .
          - service: auth_service
            image: auth-service
            dockerfile: services/auth_service/Dockerfile
            context: .
          - service: wallet_service
            image: wallet-service
            dockerfile: services/wallet_service/Dockerfile
            context: .
          - service: order_service
            image: order-service
            dockerfile: services/order_service/Dockerfile
            context: .
          - service: analytic_service
            image: analytic-service
            dockerfile: services/analytic_service/Dockerfile
            context: .
          - service: gateway_service
            image: gateway-service
            dockerfile: services/gateway_service/Dockerfile.k8s
            context: services/gateway_service
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            -t ghcr.io/${{ github.repository_owner }}/inno-taxi/${{ matrix.image }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/inno-taxi/${{ matrix.image }}:latest \
            ${{ matrix.context }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/inno-taxi/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/inno-taxi/${{ matrix.image }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/inno-taxi/${{ matrix.image }}:latest

  update-manifest:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump image tag
        run: sed -i "s/tag: .*/tag: ${{ github.sha }}/" deploy/helm/inno-taxi/values-prod.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/inno-taxi/values-prod.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }}" || exit 0
          git push
