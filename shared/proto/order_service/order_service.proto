syntax = "proto3";

package order.v1;

option go_package = "github.com/aleksiaichuk-innowise/inno_taxi/shared/proto/order_service;order_service";

import "google/api/annotations.proto";

enum TaxiType {
    TAXI_TYPE_UNSPECIFIED = 0;
    TAXI_TYPE_ECONOMY = 1;
    TAXI_TYPE_COMFORT = 2;
    TAXI_TYPE_BUSINESS = 3;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_CREATED = 1;
  STATUS_DRIVER_ASSIGNED = 2;
  STATUS_IN_PROGRESS = 3;
  STATUS_COMPLETED = 4;
  STATUS_CANCELLED = 5;
}

message CreateOrderRequest {
  TaxiType taxi_type = 1;
  Location start = 2;
  Location destination = 3;
}

message Order {
  string id = 1;
  string user_id = 2;
  string driver_id = 3;
  TaxiType taxi_type = 4;
  Location start = 5;
  Location destination = 6;
  Status status = 7;
  int64 price_minor_units = 8;
  string created_at  = 9;
  int32 rating = 10;
  string comment = 11;
}
message CreateOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderResponse {
  Order order = 1;
}

message StartTripRequest {
  string order_id = 1;
}

message StartTripResponse {
  Order order = 1;
}

message CompleteTripRequest {
  string order_id = 1;
}

message CompleteTripResponse {
  Order order = 1;
}

message RateTripRequest {
  string order_id = 1;
  int32 rating = 2;
  string comment = 3;
}

message RateTripResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total = 2;
}

message Location {
  double lat = 1;
  double long =2;
}


service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/cancel"
    };
  }

  rpc StartTrip(StartTripRequest) returns (StartTripResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/start"
    };
  }

  rpc CompleteTrip(CompleteTripRequest) returns (CompleteTripResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/complete"
    };
  }

  rpc RateTrip(RateTripRequest) returns (RateTripResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/rate"
      body: "*"
    };
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{order_id}"
    };
  }

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/orders"
    };
  }
}
